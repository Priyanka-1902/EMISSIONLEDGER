# EU CBAM Default Emission Values
# Source: Commission Implementing Regulation (EU) 2023/1773 of 17 August 2023
#         and Commission Delegated Regulation (EU) 2024/XXX (CBAM default values update)
# URL: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=OJ:JOL_2023_228_R_0001
# Effective: CBAM transitional phase from 1 October 2023; definitive phase from 1 January 2026
# Units: tCO2e per tonne of goods (unless stated)
# Note: Importers should use actual verified values where available.
#       Default values carry a 3x multiplier on CBAM certificate obligation per Art. 9(2).

metadata:
  source: eu_cbam_default
  source_publication: >
    Commission Implementing Regulation (EU) 2023/1773 of 17 August 2023 laying down
    the rules for the application of Regulation (EU) 2023/956 of the European Parliament
    and of the Council as regards reporting obligations for the purposes of the CBAM
    during the transitional period
  published_date: "2023-08-17"
  gwp_basis: AR5  # EU CBAM uses AR5 GWPs
  effective_from: "2023-10-01"
  warning: "Default values trigger 3x certificate multiplier per CBAM Art. 9(2). Use verified actuals where possible."

