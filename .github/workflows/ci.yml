name: CI — Test, Security Scan, Build

on:
  push:
    branches: [main, staging, "feat/**", "fix/**"]
  pull_request:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com

jobs:
  # ── Backend Tests ──────────────────────────────────────────────────────────
  backend-test:
    name: Backend Tests (${{ matrix.service }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        service: [auth, calculation, ingestion, reporting, audit, notification]
    services:
      postgres:
        image: timescale/timescaledb:latest-pg15
        env:
          POSTGRES_USER: emissionledger
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: emissionledger_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports: ["5432:5432"]
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: pip install -e ".[dev]"

      - name: Run Alembic migrations
        if: matrix.service == 'auth'
        env:
          DATABASE_URL: postgresql+psycopg2://emissionledger:testpassword@localhost:5432/emissionledger_test
        run: |
          cd migrations
          alembic upgrade head

      - name: Run tests with coverage
        working-directory: services/${{ matrix.service }}
        env:
          DATABASE_URL: postgresql+asyncpg://emissionledger:testpassword@localhost:5432/emissionledger_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test-secret-key-32bytes-exactly!!
          COGNITO_USER_POOL_ID: ap-south-1_TESTPOOL
          COGNITO_CLIENT_ID: testclientid
          SECRET_KEY: test-secret-key-32bytes-exactly!!
          ENVIRONMENT: test
        run: |
          pytest \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=85 \
            --junit-xml=test-results.xml \
            -v

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: services/${{ matrix.service }}/coverage.xml
          flags: ${{ matrix.service }}
          fail_ci_if_error: false

  # ── Frontend Tests ─────────────────────────────────────────────────────────
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm type-check
      - run: pnpm lint
      - run: pnpm test --coverage
      - run: pnpm build

  # ── SAST — Semgrep ─────────────────────────────────────────────────────────
  sast-semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-22.04
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/python
            p/fastapi
            p/javascript
            p/typescript
            p/owasp-top-ten
            p/secrets
            p/sql-injection
          generateSarif: "1"
          auditOn: push
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif

  # ── Dependency Scanning — Snyk ─────────────────────────────────────────────
  snyk-scan:
    name: Dependency Scan (Snyk)
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        service: [auth, calculation, ingestion, reporting, audit]
    steps:
      - uses: actions/checkout@v4
      - uses: snyk/actions/python-3.10@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=services/${{ matrix.service }}/pyproject.toml --severity-threshold=high
        continue-on-error: true  # Report but don't block; tracked in Snyk dashboard

  # ── Terraform Validate + Plan ──────────────────────────────────────────────
  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-22.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"
      - name: Terraform fmt check
        run: terraform fmt -check -recursive infra/
      - name: Terraform init (no backend)
        run: terraform init -backend=false
        working-directory: infra
      - name: Terraform validate
        run: terraform validate
        working-directory: infra

  # ── Build Docker Images ────────────────────────────────────────────────────
  build:
    name: Build & Push Images (${{ matrix.service }})
    runs-on: ubuntu-22.04
    needs: [backend-test, frontend-test, sast-semgrep]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    strategy:
      matrix:
        service: [auth, calculation, ingestion, reporting, audit, notification]
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/GithubActionsECRPush
          aws-region: ap-south-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/emissionledger-${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/emissionledger-${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            GIT_COMMIT=${{ github.sha }}
